name: Build MP3Player

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "README.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # история и теги — для списка «что нового»

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Check that all modules import
        run: python -c "import mp3player, skin_editor, lyrics, geom3d, radio, doulander_link, updater, lyrics_online, loudness, eq, dsp_player, weekly, weekly_ui, smart, lrc_maker, media_keys, panels, stats, spectrum, audio_engine, desktop_keeper, winassoc"

      - name: Updater self-test (replaces files like a real update)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tests/test_updater.py start
          python tests/test_updater.py check

      - name: Update check without the GitHub API (live)
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/test_release_check.py

      - name: Loudness measuring (Qt decoder + EBU R128)
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/test_loudness.py

      - name: Equalizer (PyAV decode + EQ bands)
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/test_eq.py

      - name: Lyrics from lrclib.net (real requests)
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/test_lyrics_online.py

      - name: UI screenshots (menu)
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tests/ui_menu.py
          python tests/ui_lrc.py
          python tests/ui_search.py
          python tests/ui_library.py

      - name: Covers and artist photos from the internet (live)
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/test_online_art.py

      - name: Search all music + tag editing (mp3, flac, m4a, ogg, opus)
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/test_library.py

      - name: Stamp build number (for auto-update)
        shell: pwsh
        run: Set-Content -Path build_info.py -Value "BUILD = ${{ github.run_number }}" -Encoding ascii

      - name: Build (folder build - starts fast)
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name MP3Player --icon assets\icon.ico --add-data "assets;assets"
          --collect-all winrt
          --hidden-import mp3player --hidden-import skin_editor --hidden-import lyrics
          --hidden-import geom3d --hidden-import radio --hidden-import doulander_link
          --hidden-import updater --hidden-import build_info --hidden-import lyrics_online --hidden-import loudness
          --collect-submodules mutagen --hidden-import eq --hidden-import dsp_player --collect-all av
          --hidden-import weekly --hidden-import weekly_ui --hidden-import lrc_maker --hidden-import library --hidden-import library_ui --hidden-import library_more --hidden-import mywave --hidden-import online_art
          launch.py

      - name: Smoke test - the exe starts and keeps running
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\MP3Player\MP3Player.exe" -PassThru
          Start-Sleep -Seconds 12
          $log = Join-Path $env:APPDATA "MP3Player\error.log"
          if (Test-Path $log) { Get-Content $log }
          if ($p.HasExited) { Write-Error "MP3Player.exe closed by itself (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Host "OK: MP3Player.exe runs"

      - name: Equalizer works in the built exe
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "dsp.txt"
          $p = Start-Process -FilePath "dist\MP3Player\MP3Player.exe" -ArgumentList "--check-dsp", "`"$out`"" -PassThru -Wait
          $msg = Get-Content $out -Raw
          Write-Host "check-dsp: $msg"
          if ($msg -ne "ok") { Write-Error "Эквалайзер в сборке не работает: $msg"; exit 1 }

      - name: Pack zip
        shell: pwsh
        run: Compress-Archive -Path dist\MP3Player -DestinationPath MP3Player.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MP3Player
          path: dist/MP3Player

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8     # русские описания коммитов
          $tag = "build-${{ github.run_number }}"
          $prev = gh release view --json tagName -q .tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $prev) { $log = git log "$prev..HEAD" --no-merges --pretty=format:%s }
          else { $log = git log -1 --pretty=format:%s }
          $items = @($log | Where-Object { $_ -and $_ -notmatch '^(Тест|тест|Test|test|CI|ci|Merge|WIP)' } | Select-Object -Unique | ForEach-Object { "- $_" })
          if ($items.Count -eq 0) { $items = @("- Мелкие исправления") }
          $notes = ($items -join "`n") + "`n`nСкачай MP3Player.zip, распакуй и запусти MP3Player.exe (папку _internal держи рядом с exe)."
          $notes | Out-File notes.md -Encoding utf8
          gh release create $tag MP3Player.zip --title "MP3 Плеер — сборка ${{ github.run_number }}" --notes-file notes.md --latest
